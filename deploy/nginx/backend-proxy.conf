# Included in the backend locations of the app host (see site.conf.template).
# Long timeouts keep WebSocket and daemon connections open while they are idle.
set $backend http://backend:8080;
proxy_pass $backend;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
include /etc/nginx/deploy/proxy-headers.conf;
